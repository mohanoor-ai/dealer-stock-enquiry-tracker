name: Verify Dealer Desk
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dealer
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: dealer_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U dealer -d dealer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_MODE: local
      APP_ENV: local
      TEST_POSTGRES_URL: postgresql+psycopg://dealer:test-only-password@localhost:5432/dealer_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: pip install -r requirements.txt
      - run: DATABASE_URL="$TEST_POSTGRES_URL" python -m alembic upgrade head
      - run: python -m pytest -q
      - run: node --test tests/frontend.test.mjs
      - run: npm ci && npm run build && npm test
        working-directory: frontend-v2
      - run: DATABASE_URL="$TEST_POSTGRES_URL" python -m alembic upgrade head
      - run: python -m pytest -q tests/integration/test_v2_postgres.py
      - run: python scripts/check_public_files.py
      - name: Review source and dependency security
        run: |
          pip install bandit==1.8.6 pip-audit==2.9.0
          python -m bandit -r backend_v2 -ll
          pip-audit -r requirements.txt --progress-spinner off
          npm audit --prefix frontend-v2 --omit=dev --audit-level=high
      - run: docker build -t dealer-desk:test .
      - run: |
          docker run -d --name dealer-smoke -p 8090:8090 dealer-desk:test
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:8090/health && break; sleep 2; done
          curl --fail http://127.0.0.1:8090/health
          curl --fail http://127.0.0.1:8090/
      - run: docker logs dealer-smoke
        if: failure()
  browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: pip install -r requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend-v2
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_journey.py
