<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dealer Desk</title><link rel="stylesheet" href="/style.css"><body><header><small>FICTIONAL DATA DEMO</small><h1>Dealer Desk</h1><p>Keep stock clear. Follow up every enquiry.</p></header><main><div id="message" role="status"></div><section id="dashboard" class="dashboard"></section><div class="grid"><section class="card"><h2 id="form-title">Add a vehicle</h2><form id="vehicle-form"><label>Make<input name="make" required maxlength="60"></label><label>Model<input name="model" required maxlength="80"></label><label>Year<input name="year" type="number" min="1900" max="2100" required></label><label>Price (£)<input name="price" type="number" min="0" max="1000000" step="0.01" required></label><button>Save vehicle</button><button type="button" id="cancel">Cancel editing</button></form></section><section class="card"><h2>Record an enquiry</h2><form id="enquiry-form"><label>Vehicle<select name="vehicle_id" id="vehicle-options" required></select></label><label>Fictional customer name<input name="customer" required maxlength="80"></label><label>Message<textarea name="message" required maxlength="1000"></textarea></label><label>Follow-up date<input name="follow_up" type="date"></label><button>Save enquiry</button></form></section></div><section class="card"><h2>Vehicle stock</h2><label>Search<input id="search" placeholder="Make or model"></label><label><input type="checkbox" id="archived"> Show archived records</label><div id="vehicles"></div></section><section class="card"><h2>Enquiries & follow-ups</h2><div id="enquiries"></div></section><footer>Local learning reference. Add authentication and operational controls before real customer use.</footer></main><script type="module" src="/app.js"></script></body></html>
